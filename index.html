<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pyrite</title>
  <meta name="description" content="pyrite">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='t' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23fff3c4'/%3E%3Cstop offset='1' stop-color='%23d4a63c'/%3E%3C/linearGradient%3E%3ClinearGradient id='l' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23c99a34'/%3E%3Cstop offset='1' stop-color='%236b4510'/%3E%3C/linearGradient%3E%3ClinearGradient id='r' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%238a5a14'/%3E%3Cstop offset='1' stop-color='%233a2606'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230b0b0b'/%3E%3Cpath d='M32 10 52 21 32 32 12 21Z' fill='url(%23t)'/%3E%3Cpath d='M12 21 32 32V55L12 44Z' fill='url(%23l)'/%3E%3Cpath d='M52 21 32 32V55L52 44Z' fill='url(%23r)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage" aria-hidden="true"></div>
  <div class="glow" id="glow" aria-hidden="true"></div>

  <header class="top">
    <h1 class="wordmark" id="wordmark">pyrite</h1>

    <div class="controls" role="search">
      <label class="search gilt">
        <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        <input id="q" type="search" placeholder="search games" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search games">
        <kbd aria-hidden="true">/</kbd>
        <button class="clear" id="clear" type="button" aria-label="Clear search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </label>

      <div class="sort gilt" role="group" aria-label="Sort games">
        <span class="thumb" aria-hidden="true"></span>
        <button type="button" data-sort="az" aria-pressed="true">A–Z</button>
        <button type="button" data-sort="random" aria-pressed="false">
          <svg class="dice" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/></svg>
          Shuffle
        </button>
      </div>
    </div>

    <p class="count" id="count" aria-live="polite"></p>
  </header>

  <main>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>no games found</p>
    <div id="sentinel" aria-hidden="true"></div>
    <noscript><p class="nojs">pyrite needs JavaScript to list the games.</p></noscript>
  </main>

  <section class="player" id="player" role="dialog" aria-modal="true" aria-labelledby="p-title" hidden>
    <div class="player-bar">
      <img class="player-icon" id="p-icon" alt="" hidden>
      <h2 class="player-title" id="p-title"></h2>
      <div class="player-actions">
        <a class="pbtn" id="p-newtab" target="_blank" rel="noopener" title="Open in new tab" aria-label="Open in new tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>
        </a>
        <button class="pbtn" id="p-full" type="button" title="Fullscreen" aria-label="Fullscreen">
          <svg class="i-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          <svg class="i-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
        </button>
        <button class="pbtn" id="p-close" type="button" title="Back to games" aria-label="Back to games">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
    <div class="player-frame" id="p-frame">
      <div class="player-loading" id="p-loading"><span class="spinner"></span><span>loading</span></div>
    </div>
    <button class="pbtn exit-theater" id="p-unfull" type="button" aria-label="Exit fullscreen" title="Exit fullscreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
    </button>
  </section>

  <script src="config.js"></script>
  <script src="games.js" charset="utf-8"></script>
  <script src="app.js"></script>
</body>
</html>
